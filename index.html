<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#56388c" />
<title>Quimera — Campanhas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--purple:#583b8c;--purple2:#7b5bb6;--ink:#2e2732;--paper:#eee0c6;--cream:#f7efdf;--line:rgba(88,59,140,.25);--ok:#356c4f;--warn:#9a5d24;--bad:#8d3333;--muted:#6d6570;--shadow:0 12px 34px rgba(49,36,38,.17)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:
radial-gradient(circle at 10% 10%,rgba(255,255,255,.35),transparent 28%),
repeating-linear-gradient(0deg,rgba(78,56,35,.025) 0 1px,transparent 1px 4px),#c7ae88;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1320px;margin:auto;padding:18px}.topbar{position:sticky;top:10px;z-index:30;background:rgba(244,234,215,.96);backdrop-filter:blur(10px);border:1px solid rgba(88,59,140,.18);box-shadow:var(--shadow);border-radius:18px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:50%;background:var(--purple);color:white;display:grid;place-items:center;font-size:21px;font-weight:950;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}h1{font-size:20px;margin:0}.subtitle{font-size:11px;color:var(--muted);font-weight:750}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid rgba(88,59,140,.3);background:rgba(255,255,255,.5);color:var(--ink);border-radius:11px;padding:9px 12px;font-weight:850}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(49,36,38,.12)}.btn.primary{background:var(--purple);color:white;border-color:var(--purple)}.btn.good{background:var(--ok);color:white;border-color:var(--ok)}.btn.danger{color:var(--bad)}.btn.small{font-size:12px;padding:7px 9px}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:rgba(88,59,140,.1);color:var(--purple);font-size:11px;font-weight:900}.badge.live{color:var(--ok);background:rgba(53,108,79,.11)}
.panel{margin-top:16px;background:rgba(244,234,215,.96);border:1px solid rgba(88,59,140,.15);border-radius:18px;box-shadow:var(--shadow);padding:18px}.panel h2{margin:0 0 12px;color:var(--purple)}.panel-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--muted);font-size:12px}.grid{display:grid;gap:12px}.campaign-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.card{border:1px solid rgba(88,59,140,.22);border-radius:15px;background:rgba(255,255,255,.42);padding:13px;transition:.16s}.card:hover{box-shadow:0 8px 20px rgba(52,38,52,.12);transform:translateY(-1px)}.card h3{margin:0 0 5px;font-size:17px}.card-footer{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}.meta{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:26px;border:2px dashed rgba(88,59,140,.22);border-radius:14px;text-align:center;color:var(--muted)}
.auth-wrap{min-height:calc(100vh - 36px);display:grid;place-items:center}.auth{width:min(520px,100%);background:rgba(244,234,215,.97);border-radius:22px;padding:23px;box-shadow:var(--shadow);border:1px solid rgba(88,59,140,.18)}.auth .logo{margin:auto;width:64px;height:64px;font-size:31px}.auth h1{text-align:center;margin-top:10px;font-size:29px;color:var(--purple)}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.auth-tabs button{padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:900}.auth-tabs button.active{background:var(--purple);color:white}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:900;color:#655b68}.field input,.field textarea,.field select{border:1.5px solid rgba(88,59,140,.25);border-radius:11px;background:rgba(255,255,255,.55);padding:10px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(88,59,140,.08)}.auth-message{font-size:12px;min-height:18px;margin-top:10px}.auth-message.bad{color:var(--bad)}.auth-message.good{color:var(--ok)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid rgba(88,59,140,.25);background:rgba(255,255,255,.35);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:900}.tab.active{background:var(--purple);color:white}.split{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:14px}.sidebar{border:1px solid rgba(88,59,140,.18);border-radius:14px;padding:10px;background:rgba(255,255,255,.3);align-self:start;position:sticky;top:90px}.folder{border-radius:10px;padding:6px}.folder-row{display:flex;align-items:center;gap:7px;padding:7px;border-radius:9px}.folder-row:hover{background:rgba(88,59,140,.07)}.folder-name{font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis}.folder-children{margin-left:15px;border-left:1px dashed rgba(88,59,140,.24);padding-left:6px}.folder.drop{outline:2px dashed var(--purple);background:rgba(88,59,140,.09)}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.entity{border:1px solid rgba(88,59,140,.2);border-radius:13px;padding:12px;background:rgba(255,255,255,.48)}.entity.dragging{opacity:.4}.entity h3{margin:0 0 3px}.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.mini-stat{border-radius:8px;padding:6px;background:rgba(88,59,140,.07);font-size:11px;text-align:center;font-weight:850}.mini-stat b{display:block;color:var(--purple);font-size:14px}.entity-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.entity-actions select{max-width:130px;border:1px solid var(--line);border-radius:8px;padding:6px;background:rgba(255,255,255,.7);font-size:11px}.scene-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.scene-card{border-left:5px solid var(--purple)}.scene-card.npc{border-left-color:var(--ok)}.scene-card.monster{border-left-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(25,18,29,.56);display:grid;place-items:center;padding:15px;z-index:100}.modal-box{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--cream);border-radius:18px;padding:18px;box-shadow:0 22px 60px rgba(0,0,0,.3)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{margin:0;color:var(--purple)}.close{background:none;border:0;font-size:24px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#2f2733;color:white;padding:11px 14px;border-radius:11px;box-shadow:var(--shadow);z-index:130;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.invite{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:950;letter-spacing:.08em;color:var(--purple)}.search{width:min(330px,100%);border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(255,255,255,.55)}
@media(max-width:760px){.app{padding:8px}.topbar{top:5px;border-radius:14px}.subtitle{display:none}.split{grid-template-columns:1fr}.sidebar{position:static}.actions .user-label{display:none}.entity-grid{grid-template-columns:1fr}.panel{padding:13px}.bars{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="authView" class="app auth-wrap hidden">
  <div class="auth">
    <div class="logo">Q</div><h1>Quimera</h1><div class="subtitle" style="text-align:center">Campanhas e fichas em tempo real</div>
    <div class="auth-tabs"><button id="loginTab" class="active">Entrar</button><button id="signupTab">Criar conta</button></div>
    <div id="signupName" class="field hidden"><label>Seu nome</label><input id="displayName" autocomplete="name" placeholder="Nome do jogador"></div>
    <div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"></div>
    <div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Mínimo de 6 caracteres"></div>
    <button id="authSubmit" class="btn primary" style="width:100%">Entrar</button>
    <div id="authMessage" class="auth-message"></div>
  </div>
</div>
<div id="mainView" class="app hidden">
  <header class="topbar"><div class="brand"><div class="logo">Q</div><div><h1>Quimera</h1><div id="crumb" class="subtitle">Campanhas</div></div></div><div class="actions"><span class="badge live">● online</span><span id="userLabel" class="user-label muted"></span><button id="homeBtn" class="btn small hidden">Campanhas</button><button id="signOutBtn" class="btn small">Sair</button></div></header>
  <main id="content"></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="close">×</button></div><div id="modalBody" style="margin-top:14px"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://zdhztatcmxxpehbqhvat.supabase.co';
const SUPABASE_KEY='sb_publishable_afNazfZ4b57Oggo6VAK3Rg_p8jdsV1A';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,user=null,authMode='login',campaigns=[],memberships=[],currentCampaign=null,currentRole=null,chars=[],folders=[],channel=null,refreshTimer=null,activeTab='session';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)}
function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function authMessage(msg,type=''){const e=$('#authMessage');e.textContent=msg;e.className='auth-message '+type}
function setAuthMode(mode){authMode=mode;$('#loginTab').classList.toggle('active',mode==='login');$('#signupTab').classList.toggle('active',mode==='signup');$('#signupName').classList.toggle('hidden',mode!=='signup');$('#authSubmit').textContent=mode==='login'?'Entrar':'Criar conta';$('#password').autocomplete=mode==='login'?'current-password':'new-password';authMessage('')}
$('#loginTab').onclick=()=>setAuthMode('login');$('#signupTab').onclick=()=>setAuthMode('signup');
$('#authSubmit').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value,name=$('#displayName').value.trim();if(!email||!password)return authMessage('Preencha e-mail e senha.','bad');$('#authSubmit').disabled=true;authMessage('Conectando...');try{if(authMode==='signup'){const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name||email.split('@')[0]},emailRedirectTo:location.origin}});if(error)throw error;if(!data.session){authMessage('Conta criada. Confira seu e-mail para confirmar o cadastro e depois volte aqui.','good')}else authMessage('Conta criada!','good')}else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}}catch(e){authMessage(e.message||'Não foi possível entrar.','bad')}finally{$('#authSubmit').disabled=false}};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#authSubmit').click()});
$('#signOutBtn').onclick=()=>sb.auth.signOut();$('#homeBtn').onclick=()=>{history.pushState({},'',location.pathname);openHome()};window.onpopstate=route;
function showAuth(){if(channel){sb.removeChannel(channel);channel=null}$('#authView').classList.remove('hidden');$('#mainView').classList.add('hidden')}
function showMain(){$('#authView').classList.add('hidden');$('#mainView').classList.remove('hidden');$('#userLabel').textContent=user?.user_metadata?.display_name||user?.email||''}
async function loadCampaigns(){const {data:m,error}=await sb.from('campaign_members').select('campaign_id,role').eq('user_id',user.id);if(error)throw error;memberships=m||[];const ids=memberships.map(x=>x.campaign_id);campaigns=[];if(ids.length){const {data,error}=await sb.from('campaigns').select('*').in('id',ids).order('updated_at',{ascending:false});if(error)throw error;campaigns=data||[]}}
function roleFor(id){return memberships.find(x=>x.campaign_id===id)?.role||null}
async function openHome(){if(channel){sb.removeChannel(channel);channel=null}currentCampaign=null;currentRole=null;$('#homeBtn').classList.add('hidden');$('#crumb').textContent='Campanhas';await loadCampaigns();renderHome()}
function renderHome(){const cards=campaigns.map(c=>`<article class="card"><div class="meta"><span class="badge">${roleFor(c.id)==='master'?'Mestre':'Jogador'}</span></div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.description||'Sem descrição')}</div><div class="card-footer"><span class="muted">${new Date(c.updated_at).toLocaleDateString('pt-BR')}</span><button class="btn primary small" data-open-campaign="${c.id}">Abrir</button></div></article>`).join('');$('#content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Minhas campanhas</h2><div class="muted">Escolha uma campanha ou entre em uma nova com um código.</div></div><div class="actions"><button id="joinBtn" class="btn">Entrar com código</button><button id="newCampaignBtn" class="btn primary">+ Nova campanha</button></div></div><div class="grid campaign-grid" style="margin-top:14px">${cards||'<div class="empty">Nenhuma campanha ainda.</div>'}</div></section>`;document.querySelectorAll('[data-open-campaign]').forEach(b=>b.onclick=()=>openCampaign(b.dataset.openCampaign));$('#newCampaignBtn').onclick=openNewCampaign;$('#joinBtn').onclick=openJoinCampaign}
function openNewCampaign(){showModal('Nova campanha',`<div class="field"><label>Nome</label><input id="newCampName" placeholder="Nome da campanha"></div><div class="field"><label>Descrição</label><textarea id="newCampDesc" rows="3" placeholder="Opcional"></textarea></div><button id="createCamp" class="btn primary" style="width:100%">Criar campanha</button>`);$('#createCamp').onclick=async()=>{const name=$('#newCampName').value.trim();if(!name)return toast('Digite um nome.');const {data,error}=await sb.from('campaigns').insert({name,description:$('#newCampDesc').value.trim()||null,owner_id:user.id}).select().single();if(error)return toast(error.message);closeModal();await openCampaign(data.id)}}
function openJoinCampaign(){showModal('Entrar em campanha',`<div class="field"><label>Código de convite</label><input id="joinCode" maxlength="12" style="text-transform:uppercase" placeholder="AB12CD34"></div><button id="joinCamp" class="btn primary" style="width:100%">Entrar</button>`);$('#joinCamp').onclick=async()=>{const code=$('#joinCode').value.trim();if(!code)return;const {data,error}=await sb.rpc('join_campaign_by_code',{code});if(error)return toast(error.message);closeModal();await openCampaign(data)}}
async function openCampaign(id,push=true){await loadCampaigns();currentCampaign=campaigns.find(c=>c.id===id);currentRole=roleFor(id);if(!currentCampaign){toast('Campanha não encontrada.');return openHome()}if(push)history.pushState({},'',`?campaign=${encodeURIComponent(id)}`);$('#homeBtn').classList.remove('hidden');$('#crumb').textContent=currentCampaign.name;activeTab=currentRole==='master'?'session':'players';await loadCampaignData();subscribeCampaign();renderCampaign()}
async function loadCampaignData(){if(!currentCampaign)return;const [c,f]=await Promise.all([sb.from('characters').select('*').eq('campaign_id',currentCampaign.id).eq('is_archived',false).order('updated_at',{ascending:false}),currentRole==='master'?sb.from('folders').select('*').eq('campaign_id',currentCampaign.id).order('sort_order').order('name'):Promise.resolve({data:[],error:null})]);if(c.error)throw c.error;if(f.error)throw f.error;chars=c.data||[];folders=f.data||[]}
function subscribeCampaign(){if(channel)sb.removeChannel(channel);channel=sb.channel('campaign-'+currentCampaign.id).on('postgres_changes',{event:'*',schema:'public',table:'characters',filter:`campaign_id=eq.${currentCampaign.id}`},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'folders',filter:`campaign_id=eq.${currentCampaign.id}`},scheduleRefresh).subscribe()}
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(async()=>{await loadCampaignData();renderCampaignBody()},150)}
function summary(ch){const s=ch.sheet||{},a=s.attrs||{},L=Number(s.char?.level??ch.level??1),m={pv:Math.max(0,(Number(a.CON)||0)*3+L),ps:Math.max(0,(Number(a.ESP)||0)+(Number(a.INT)||0)+L),pd:Math.max(0,(Number(a.CON)||0)+(Number(a.ESP)||0)+L)};const r=s.resources||{};return{level:L,pv:r.pv??m.pv,pvMax:m.pv,ps:r.ps??m.ps,psMax:m.ps,pd:r.pd??m.pd,pdMax:m.pd,def:(Number(a.DES)||0)+(Number(a.PER)||0)+(Number(a.CON)||0)+(Number(s.char?.armor)||0)}}
function renderCampaign(){const master=currentRole==='master';$('#content').innerHTML=`<section class="panel"><div class="panel-head"><div><div class="meta"><span class="badge">${master?'Mestre':'Jogador'}</span>${master?'<span class="badge live">tempo real</span>':''}</div><h2 style="margin-top:7px">${esc(currentCampaign.name)}</h2><div class="muted">${esc(currentCampaign.description||'')}</div></div>${master?`<div style="text-align:right"><div class="muted">Código de convite</div><div class="invite">${esc(currentCampaign.invite_code)}</div><button id="copyInvite" class="btn small">Copiar código</button></div>`:''}</div><div class="tabs" id="campaignTabs">${master?'<button class="tab" data-tab="session">Sessão</button><button class="tab" data-tab="players">Jogadores</button><button class="tab" data-tab="npcs">NPCs</button><button class="tab" data-tab="monsters">Monstros</button>':'<button class="tab" data-tab="players">Meus personagens</button>'}</div><div id="campaignBody"></div></section>`;if(master)$('#copyInvite').onclick=async()=>{await navigator.clipboard.writeText(currentCampaign.invite_code);toast('Código copiado.')};document.querySelectorAll('#campaignTabs .tab').forEach(t=>t.onclick=()=>{activeTab=t.dataset.tab;renderCampaignBody()});renderCampaignBody()}
function renderCampaignBody(){if(!currentCampaign)return;document.querySelectorAll('#campaignTabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeTab));if(activeTab==='session')renderSession();else if(activeTab==='players')renderPlayers();else if(activeTab==='npcs')renderLibrary('npc');else renderLibrary('monster')}
function entityCard(ch,{master=false,kind=ch.kind,showMove=false}={}){const s=summary(ch),folderOpts=folders.filter(f=>f.kind===kind||f.kind==='mixed').map(f=>`<option value="${f.id}" ${ch.folder_id===f.id?'selected':''}>${esc(f.name)}</option>`).join('');return `<article class="entity ${kind}" draggable="${master&&kind!=='player'}" data-char-id="${ch.id}"><div class="meta"><span class="badge">${kind==='player'?'Jogador':kind==='npc'?'NPC':'Monstro'}</span>${ch.is_in_scene?'<span class="badge live">Em cena</span>':''}</div><h3>${esc(ch.name)}</h3><div class="muted">${kind==='player'?esc(ch.player_name||ch.sheet?.char?.player||'Jogador não informado'):`NV ${s.level}`}</div><div class="bars"><div class="mini-stat"><b>${s.level}</b>NV</div><div class="mini-stat"><b>${s.pv}/${s.pvMax}</b>PV</div><div class="mini-stat"><b>${s.def}</b>DEF</div></div><div class="entity-actions"><button class="btn primary small" data-open-sheet="${ch.id}">Abrir ficha</button>${master&&kind!=='player'?`<button class="btn small" data-scene="${ch.id}">${ch.is_in_scene?'Tirar da cena':'Pôr em cena'}</button><button class="btn small" data-dup="${ch.id}">Duplicar</button>${showMove?`<select data-move="${ch.id}"><option value="">Sem pasta</option>${folderOpts}</select>`:''}`:''}</div></article>`}
function bindEntityActions(){document.querySelectorAll('[data-open-sheet]').forEach(b=>b.onclick=()=>location.href=`/ficha?id=${encodeURIComponent(b.dataset.openSheet)}`);document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=async()=>{const ch=chars.find(x=>x.id===b.dataset.scene);await sb.from('characters').update({is_in_scene:!ch.is_in_scene}).eq('id',ch.id)});document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>duplicateCharacter(b.dataset.dup));document.querySelectorAll('[data-move]').forEach(s=>s.onchange=()=>sb.from('characters').update({folder_id:s.value||null}).eq('id',s.dataset.move));document.querySelectorAll('.entity[draggable="true"]').forEach(el=>{el.ondragstart=e=>{el.classList.add('dragging');e.dataTransfer.setData('text/plain',el.dataset.charId)};el.ondragend=()=>el.classList.remove('dragging')})}
function renderPlayers(){const own=currentRole==='master'?chars.filter(c=>c.kind==='player'):chars.filter(c=>c.kind==='player'&&c.owner_user_id===user.id);$('#campaignBody').innerHTML=`<div class="panel-head"><div><h3 style="margin:0">${currentRole==='master'?'Personagens dos jogadores':'Seus personagens'}</h3><div class="muted">Clique para abrir a ficha completa. Alterações aparecem em tempo real.</div></div>${currentRole==='master'?'':`<button id="newPlayerChar" class="btn primary">+ Novo personagem</button>`}</div><div class="entity-grid" style="margin-top:12px">${own.map(c=>entityCard(c,{master:currentRole==='master'})).join('')||'<div class="empty">Nenhum personagem nesta campanha.</div>'}</div>`;bindEntityActions();if($('#newPlayerChar'))$('#newPlayerChar').onclick=()=>createCharacter('player')}
function renderSession(){const list=[...chars.filter(c=>c.kind==='player'),...chars.filter(c=>c.kind!=='player'&&c.is_in_scene)];$('#campaignBody').innerHTML=`<div class="panel-head"><div><h3 style="margin:0">Sessão ao vivo</h3><div class="muted">Jogadores aparecem sempre. NPCs e monstros aparecem quando marcados como “Em cena”.</div></div></div><div class="scene-grid" style="margin-top:12px">${list.map(c=>entityCard(c,{master:true})).join('')||'<div class="empty">Nada em cena.</div>'}</div>`;bindEntityActions()}
function folderTree(kind,parent=null){return folders.filter(f=>(f.parent_id||null)===parent&&(f.kind===kind||f.kind==='mixed')).map(f=>`<div class="folder" data-folder-drop="${f.id}"><div class="folder-row"><span>📁</span><span class="folder-name">${esc(f.name)}</span><button class="btn small" data-add-sub="${f.id}">+</button></div><div class="folder-children">${folderTree(kind,f.id)}</div></div>`).join('')}
function renderLibrary(kind){const title=kind==='npc'?'NPCs':'Monstros',filtered=chars.filter(c=>c.kind===kind),q='';$('#campaignBody').innerHTML=`<div class="panel-head"><div><h3 style="margin:0">Biblioteca de ${title}</h3><div class="muted">Crie pastas e subpastas por cidade, região, facção ou qualquer organização que preferir.</div></div><div class="actions"><input id="entitySearch" class="search" placeholder="Buscar ${title.toLowerCase()}..."><button id="newFolder" class="btn">+ Pasta</button><button id="newEntity" class="btn primary">+ ${kind==='npc'?'NPC':'Monstro'}</button></div></div><div class="split" style="margin-top:12px"><aside class="sidebar"><div class="muted" style="font-weight:900;margin-bottom:6px">PASTAS</div><div id="folderRoot" class="folder" data-folder-drop=""><div class="folder-row"><span>🗂️</span><span class="folder-name">Sem pasta</span></div></div>${folderTree(kind)}</aside><div><div id="entityGrid" class="entity-grid">${filtered.map(c=>entityCard(c,{master:true,kind,showMove:true})).join('')||'<div class="empty">Nada cadastrado ainda.</div>'}</div></div></div>`;bindEntityActions();bindFolderDrops(kind);$('#newFolder').onclick=()=>createFolder(kind,null);$('#newEntity').onclick=()=>createCharacter(kind);document.querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=e=>{e.stopPropagation();createFolder(kind,b.dataset.addSub)});$('#entitySearch').oninput=e=>{const needle=e.target.value.trim().toLowerCase();document.querySelectorAll('#entityGrid .entity').forEach(el=>{const ch=chars.find(x=>x.id===el.dataset.charId);el.classList.toggle('hidden',!!needle&&!`${ch.name} ${ch.player_name||''}`.toLowerCase().includes(needle))})}}
function bindFolderDrops(kind){document.querySelectorAll('[data-folder-drop]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('drop')};el.ondragleave=()=>el.classList.remove('drop');el.ondrop=async e=>{e.preventDefault();el.classList.remove('drop');const id=e.dataTransfer.getData('text/plain'),ch=chars.find(x=>x.id===id);if(!ch||ch.kind!==kind)return;await sb.from('characters').update({folder_id:el.dataset.folderDrop||null}).eq('id',id)}})}
function createFolder(kind,parentId){const parentOptions=folders.filter(f=>f.kind===kind||f.kind==='mixed').map(f=>`<option value="${f.id}" ${parentId===f.id?'selected':''}>${esc(f.name)}</option>`).join('');showModal('Nova pasta',`<div class="field"><label>Nome</label><input id="folderName" placeholder="Ex.: NPCs da Cidade Baixa"></div><div class="field"><label>Dentro de</label><select id="folderParent"><option value="">Raiz</option>${parentOptions}</select></div><button id="saveFolder" class="btn primary" style="width:100%">Criar pasta</button>`);$('#saveFolder').onclick=async()=>{const name=$('#folderName').value.trim();if(!name)return;const {error}=await sb.from('folders').insert({campaign_id:currentCampaign.id,parent_id:$('#folderParent').value||null,name,kind});if(error)return toast(error.message);closeModal();toast('Pasta criada.')}}
function defaultSheet(name='',player=''){return{char:{name,player,concept:'',level:1,armor:0,pa:0,pressure:0,inventory:'',notes:'',luckNumber:'',otherResources:''},attrs:{CON:0,FOR:0,DES:0,INT:0,PER:0,CAR:0,ESP:0},resources:{pv:null,ps:null,pd:null},skills:{},modifiers:[],advantages:{},luckSources:{},advPayments:{},creation:{enabled:false,pa:0},bonds:[]}}
function createCharacter(kind){const isPlayer=kind==='player',label=isPlayer?'Personagem':kind==='npc'?'NPC':'Monstro',folderOpts=folders.filter(f=>f.kind===kind||f.kind==='mixed').map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');showModal(`Novo ${label}`,`<div class="field"><label>Nome</label><input id="charName" placeholder="Nome"></div>${isPlayer?`<div class="field"><label>Jogador</label><input id="playerName" value="${esc(user.user_metadata?.display_name||'')}" placeholder="Nome do jogador"></div>`:`<div class="field"><label>Pasta</label><select id="charFolder"><option value="">Sem pasta</option>${folderOpts}</select></div>`}<button id="saveChar" class="btn primary" style="width:100%">Criar e abrir ficha</button>`);$('#saveChar').onclick=async()=>{const name=$('#charName').value.trim();if(!name)return toast('Digite um nome.');const player=isPlayer?$('#playerName').value.trim():'';const payload={campaign_id:currentCampaign.id,owner_user_id:isPlayer?user.id:null,folder_id:isPlayer?null:($('#charFolder').value||null),kind,name,player_name:player||null,level:1,sheet:defaultSheet(name,player),created_by:user.id};const {data,error}=await sb.from('characters').insert(payload).select().single();if(error)return toast(error.message);closeModal();location.href=`/ficha?id=${encodeURIComponent(data.id)}`}}
async function duplicateCharacter(id){const ch=chars.find(x=>x.id===id);if(!ch)return;const copy={campaign_id:ch.campaign_id,owner_user_id:null,folder_id:ch.folder_id,kind:ch.kind,name:ch.name+' (cópia)',player_name:null,level:ch.level,sheet:ch.sheet,created_by:user.id,is_in_scene:false};const {error}=await sb.from('characters').insert(copy);if(error)toast(error.message);else toast('Cópia criada.')}
async function route(){if(!session)return;const id=new URLSearchParams(location.search).get('campaign');if(id)await openCampaign(id,false);else await openHome()}
sb.auth.onAuthStateChange(async(_event,newSession)=>{session=newSession;user=newSession?.user||null;if(!session){showAuth();return}showMain();await route()});
(async()=>{const {data}=await sb.auth.getSession();session=data.session;user=session?.user||null;if(!session)showAuth();else{showMain();await route()}})();
</script>
</body></html>
